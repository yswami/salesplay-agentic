const D=AgenticScenario,E=AgenticEngine,$=q=>document.querySelector(q);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<img src="${EMBEDDED_ASSETS[n]}" alt="">`;
const badge=(text,tone='')=>`<span class="badge ${tone}">${esc(text)}</span>`;
const KEY='salesplay-agentic-customer-v1';let state=E.initial(D.defaultGoal),timer=null,storageFailed=false;
try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v?.schema===1&&Array.isArray(v.events)&&Array.isArray(v.saved)&&v.versions&&v.feedback&&v.analyst){state={...state,...v};if(state.run?.status==='running'){state=E.pause(state);}}}catch{}
let goalNote=state.goal,feedbackAccount='';
function cacheGoalNote(value){goalNote=value;}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{storageFailed=true;}}
function set(next){state=next;persist();render();}
function go(route){if(location.hash.slice(1)===route){render();window.scrollTo(0,0);}else location.hash=route;}
function toast(s){$('#toast').textContent=s;$('#toast').classList.add('visible');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),2500);}
function closeDialog(){$('#dialog').close();}
function dialog(label,title,body){if($('#dialog').open)closeDialog();$('#dialog-content').innerHTML=`<div class="dialog-body"><div class="dialog-header"><div><span class="eyebrow">${esc(label)}</span><h2>${esc(title)}</h2></div><button class="icon-button" aria-label="Close details" onclick="closeDialog()">${icon('x')}</button></div>${body}</div>`;$('#dialog').showModal();}
function journey(current){return `<ol class="journey" aria-label="Opportunity journey">${['Set a goal','Agent research','Review & act','Adapt'].map((t,i)=>`<li class="${i===current?'current':''}" ${i===current?'aria-current="step"':''}><span class="step-num">${i+1}</span>${t}</li>`).join('')}</ol>`;}
function render(){const parts=(location.hash.slice(1)||'goal').split('/');let route=parts[0],id=parts[1];if(['opportunity','play'].includes(route)&&!['ridgeway','harbor','evergreen'].includes(id))route='opportunities';const nav=route==='investigation'?'activity':['opportunity','play'].includes(route)?'opportunities':route;document.querySelectorAll('[data-nav]').forEach(a=>{a.classList.toggle('active',a.dataset.nav===nav);if(a.dataset.nav===nav)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});const path=$('.workspace-path');if(path)path.innerHTML='Workspace <span>/</span> '+({goal:'Growth goal',investigation:'Agent research',opportunities:'Opportunities',opportunity:'Account opportunity',play:'Conversation play',activity:'Agent activity',saved:'Saved plays'}[route]||'Growth goal');$('#saved-count').textContent=state.saved.length;const body=route==='investigation'?investigation():route==='opportunities'?opportunities():route==='opportunity'?opportunity(id):route==='play'?play(id):route==='activity'?activity():route==='saved'?saved():goal();$('#main').innerHTML=(storageFailed?'<div class="storage-note">Browser storage is unavailable. Your work is available for this session.</div>':'')+body;}
function goal(){return `<span class="eyebrow">ACCOUNT DISCOVERY</span><h1>Find accounts worth<br>your next conversation.</h1><p class="intro">Agents connect market research to account fit, then prepare your next move.</p>${journey(0)}<div class="goal-layout"><section class="surface"><div class="goal-card-head"><h2><label for="goal-text">Your growth goal</label></h2><button class="button" onclick="beginGoal()">${state.round?'Refresh research':'Find opportunities'}${icon('arrow-right')}</button></div><textarea class="goal-input" maxlength="240" id="goal-text" oninput="cacheGoalNote(this.value)">${esc(goalNote)}</textarea><div class="scope"><div><small>YOUR SOLUTION</small><strong>${D.product}</strong><p>${D.plainProduct}</p></div><div><small>YOUR MARKET</small><strong>${D.territory}</strong><p>Include accounts beyond your current list.</p></div></div><p class="goal-help">Example goal · results use sample transformer-manufacturing data.</p><div id="goal-error" class="error" role="status"></div><div class="actions">${state.round?'<button class="link" onclick="go(\'opportunities\')">View current opportunities</button>':''}${state.run?.status==='paused'?'<button class="link" onclick="resumeRun()">Resume research</button>':''}</div></section><aside><section class="surface"><span class="eyebrow">A RELEVANT MATCH</span><h2>Demand is the starting point. Process fit matters.</h2><p>Your equipment supports laminated-core assembly. SalesPlay looks for manufacturers that do that work in-house.</p><div class="fit-summary"><strong>What you get</strong><p>Accounts to investigate, evidence behind each match, and the next question to ask.</p></div></section></aside></div>`;}
function beginGoal(){const text=$('#goal-text').value.trim();try{let next=E.changeGoal(state,text);next=E.start(next,D);set(next);go('investigation');startTimer();}catch(e){$('#goal-error').textContent=e.message;}}
function startTimer(){clearInterval(timer);timer=setInterval(()=>{if(state.run?.status!=='running'){clearInterval(timer);return;}state=E.advance(state,D);persist();const route=(location.hash.slice(1)||'goal').split('/')[0];if(['investigation','activity'].includes(route))render();if(state.run.status==='complete'){clearInterval(timer);if(route==='investigation')go('opportunities');else toast('Investigation complete. Review the opportunities when ready.');}},1500);}
function pauseRun(){clearInterval(timer);set(E.pause(state));}
function resumeRun(){set(E.resume(state));go('investigation');startTimer();}
function sourceTitle(id){return id.startsWith('buyer-')?'Sample buyer response':D.sources[id]?.title||id;}
function sourcePills(ids){return `<div class="source-pills">${[...new Set(ids)].map(id=>`<button class="source-pill" onclick="openSource('${id}')">${esc(sourceTitle(id))}</button>`).join('')}</div>`;}
function latestActivity(limit=3){const events=state.events.filter(e=>e.kind!=='run').slice(-limit).reverse();return events.length?events.map(e=>`<div class="activity-mini"><strong>${esc(e.account?D.accounts[e.account].name+': '+e.title:e.title)}</strong><p>${esc(e.detail)}</p>${sourcePills(e.sources)}</div>`).join(''):'<p class="mini">Research updates will appear here.</p>';}
function memory(){return `<p class="goal-memory"><strong>Goal:</strong> ${esc(state.goal)}</p><p class="goal-memory"><strong>Product condition:</strong> laminated cores assembled in-house.</p>${E.excluded(state,'ridgeway')?`<p class="goal-memory"><strong>Buyer-corrected fact:</strong> Ridgeway outsources assembly.</p><p class="goal-memory"><strong>Revised search:</strong> require explicit, recent in-house assembly evidence for the next recommendation.</p>`:'<p class="goal-memory"><strong>Validation condition:</strong> process fit is provisional until checked with the buyer.</p>'}`;}
function investigation(){if(!state.run)return empty('Give SalesPlay a goal first.','The investigation starts from your product, territory, and intended outcome.','Set a growth goal','goal');const run=state.run,steps=D.plans[run.mode];return `<div class="page-head"><div><span class="eyebrow">AGENT RESEARCH · ${run.id}</span><h1>${run.mode==='adaptive'?'Updating the search with your buyer feedback.':'Finding accounts for your goal.'}</h1><p>${run.mode==='adaptive'?'Looking for explicit in-house assembly evidence at another account.':'Connecting market demand, product fit, and account evidence.'}</p></div>${badge(run.status==='paused'?'Paused for review':run.status==='complete'?'Investigation complete':'Working through the plan',run.status==='paused'?'amber':'green')}</div>${journey(run.mode==='adaptive'?3:1)}<div class="live-layout"><section class="surface"><div class="run-status"><span class="dot"></span>${run.step} of ${steps.length} steps complete<span style="margin-left:auto">${run.status==='running'?'<button class="button outline small" onclick="pauseRun()">Pause investigation</button>':run.status==='paused'?'<button class="button small" onclick="resumeRun()">Resume investigation</button>':'<button class="button small" onclick="go(\'opportunities\')">Review opportunities</button>'}</span></div><h2>Plan for this goal</h2><ol class="plan-list">${steps.map((step,i)=>`<li class="${i<run.step?'done':i===run.step?'active':'pending'}"><span class="step-num">${i<run.step?'✓':i+1}</span><div><h3>${step.label}</h3><p>${i<run.step?esc(step.result):i===run.step?(run.status==='running'?'Reviewing the account evidence…':'Ready when you resume this step.'):'Waiting for the preceding step.'}</p>${i<run.step?sourcePills(step.sources):''}</div></li>`).join('')}</ol></section><aside><section class="surface"><span class="eyebrow">KEPT WITH THIS GOAL</span><h3>Context the next step uses</h3>${memory()}</section><section class="surface"><h3>Latest research activity</h3>${latestActivity(2)}</section></aside></div>`;}
function empty(title,body,label,route){return `<section class="surface empty"><strong>${title}</strong><p>${body}</p><div class="actions" style="justify-content:center"><button class="button" onclick="go('${route}')">${label}${icon('arrow-right')}</button></div></section>`;}
function card(id){const a=D.accounts[id],st=E.status(state,id);const evergreen=id==='evergreen';return `<article class="account-card" data-account="${id}"><div class="account-head"><div class="avatar">${a.initials}</div><div><h2>${a.name}</h2><p>${a.process}</p></div>${badge(a.relationship,a.relationship==='New account'?'green':'')}</div><h3>${id==='harbor'&&state.monitoringApplied?'A timing change calls for a different follow-up.':evergreen?'A stronger process match, found by the revised search.':id==='ridgeway'?'A new account worth validating with plant operations.':state.round>=2?'Held for process evidence from the account owner.':'An expansion review to clarify with the account owner.'}</h3><div class="reason-grid"><div><strong>Why this account</strong><p>${evergreen?'The sample operations profile explicitly describes in-house laminated-core assembly.':id==='ridgeway'?'Industry context plus a provisional process profile suggests a possible fit.':state.monitoringApplied?'A sample update says the expansion review has been postponed.':'An existing account note mentions expansion; production scope is still open.'}</p></div><div><strong>What remains open</strong><p>${st.route==='analyst'?'Product-segment relevance, then buyer need and timing.':st.route==='technical'?'Equipment compatibility, installation constraints, costs, and budget.':id==='harbor'?'Explicit in-house process evidence, scope, and timing.':'An actual production constraint, ownership, and timing.'}</p></div><div><strong>Next action</strong><p>${st.action}.</p>${badge(st.label,st.tone)}</div></div><div class="actions"><button class="button ${id==='harbor'?'outline':''}" onclick="go('opportunity/${id}')">${evergreen?'Review the new opportunity':id==='ridgeway'?'Review Ridgeway’s opportunity':'Review HarborGrid'}${icon('arrow-right')}</button></div></article>`;}
function opportunities(){if(state.run&&['running','paused'].includes(state.run.status))return `${empty('Research is still in progress.','Return to the current plan to review progress.','View investigation','investigation')}`;if(!state.round)return empty('Your next opportunity starts with a goal.','SalesPlay needs a product and market context before it can prepare an account decision.','Set a growth goal','goal');const ids=E.candidates(state);const primary=ids.filter(id=>id!=='harbor');return `<div class="page-head"><div><span class="eyebrow">YOUR OPPORTUNITIES · RESEARCH ${state.run?.id||1}</span><h1>${state.round>=2?'Your shortlist has changed.':'Accounts worth a closer look.'}</h1><p>${state.round>=2?'SalesPlay used the buyer correction to change its search and investigate a different manufacturer.':'Review the fit, the evidence, and the next question to ask.'}</p></div>${badge(state.round>=2?'Updated shortlist':'Research complete','green')}</div>${journey(state.round>=2?3:2)}${state.round>=2?`<div class="changed-box"><span class="eyebrow">WHAT CHANGED AFTER BUYER FEEDBACK</span><h3>Ridgeway is out. Explicit in-house assembly evidence is now required.</h3><p>The correction is recorded for Ridgeway. The investigation criteria are updated for this product goal. The old saved play needs review.</p><div class="actions"><button class="link" onclick="changeSummary()">Inspect what changed${icon('arrow-right')}</button></div></div>`:''}<div class="live-layout"><div><div class="card-list">${primary.length?primary.map(card).join(''):empty('No new account meets the current evidence conditions.','No additional match is supported by this sample workspace. More research is needed before recommending another account.','Inspect research activity','activity')}${ids.includes('harbor')?(state.round>=2?'<h3 class="panel-title" style="margin:8px 0 -5px">Needs more process evidence</h3>':'')+card('harbor'):''}</div><section class="surface" style="margin-top:20px"><h3>Outside this product search</h3>${E.exclusions(state).map(id=>`<div class="excluded-row"><div><strong>${D.accounts[id].name}</strong><p>${id==='summit'?'Wound-core production does not fit this stacking equipment.':'Sample buyer feedback says core assembly is outsourced.'}</p></div><button class="link" onclick="${id==='summit'?"openSource('summit')":`go('opportunity/${id}')`}">View reason</button></div>`).join('')}</section></div><aside><section class="surface"><span class="eyebrow">YOUR SEARCH CRITERIA</span><h3>What makes an account relevant</h3>${memory()}<div class="actions"><button class="link" onclick="go('activity')">View the research activity${icon('arrow-right')}</button></div></section><section class="surface"><h3>What specialist research adds</h3><p>Move from “transformer demand is growing” to the product segments and manufacturing processes your equipment can serve.</p><div class="actions"><button class="link" onclick="researchConnection()">See the research connection${icon('arrow-right')}</button></div></section></aside></div>`;}
function chainItem(num,title,body,type,source){return `<li><span class="step-num">${num}</span><div><h3>${title}</h3><p>${body}</p>${badge(type)}</div><button class="link" onclick="openSource('${source}')">View evidence${icon('arrow-up-right')}</button></li>`;}
function opportunity(id){if(!state.round)return empty('Run the investigation first.','Account recommendations appear after research is complete.','Set the goal','goal');if(id==='evergreen'&&state.round<2)return empty('This account has not been investigated yet.','The revised investigation follows a buyer correction to the initial recommendation.','View current opportunities','opportunities');const a=D.accounts[id],st=E.status(state,id),out=E.excluded(state,id);return `<a href="#opportunities" class="back">${icon('arrow-left')}All opportunities</a><div class="page-head"><div><span class="eyebrow">${a.relationship.toUpperCase()} · ${a.name.toUpperCase()}</span><h1>${esc(a.name)}</h1><p>${out?'The current buyer response takes priority over the starting profile.':esc(a.why)}</p></div><div class="detail-actions">${badge(st.label,st.tone)}${!out?`<button class="button" onclick="${st.route==='analyst'?"analystHandoff()":`openPlay('${id}')`}">${st.route==='analyst'?'Review analyst question':st.route==='technical'?'Prepare technical review':id==='harbor'&&state.monitoringApplied?'Prepare follow-up':'Prepare conversation'}${icon('arrow-right')}</button>`:''}</div></div>${out?`<section class="surface"><div class="note amber" style="margin-top:0"><span class="eyebrow">SAMPLE BUYER FEEDBACK</span><h2>“We outsource core assembly.”</h2><p>This account does not perform the work the equipment supports. The previous play is out of date.</p></div><div class="actions"><button class="button" onclick="go('opportunities')">Review the revised opportunities${icon('arrow-right')}</button><button class="link" onclick="changeSummary()">See how the investigation changed</button></div></section>`:`<div class="live-layout"><section class="surface"><h2>Why this account</h2><ol class="evidence-chain">${chainItem(1,'The market creates a reason to investigate.','Grid equipment faces demand and supply constraints. That is context for prospecting, not an account order.','Public industry context','doe')}${chainItem(2,'Specialist research narrows the relevant process.','The sample research map links utility demand to laminated cores assembled in-house.','Sample specialist research','segment')}${chainItem(3,id==='evergreen'?'The new profile explicitly describes in-house assembly.':id==='harbor'?'The account note mentions expansion.':'The starting account profile suggests a process fit.',id==='evergreen'?(state.feedback[id]?.need==='confirmed'?'Explicit in-house evidence matches the product process. The current buyer fact and analyst check define the next step.':state.analyst.applied?'Process and segment relevance are supported in the scenario. The buyer’s production need still needs confirmation.':'Evergreen meets the revised process-evidence requirement. An analyst check and buyer conversation still matter.'):id==='harbor'?'The production scope is unclear. The account owner should establish whether this equipment is relevant.':(state.feedback[id]?'The starting profile is retained as history. The current buyer fact below takes priority.':'Confirm with the plant team whether core assembly happens in-house.'),'Fictional account record',id)}${state.feedback[id]?chainItem(4,'Buyer feedback updates the account.',state.feedback[id].need==='confirmed'?'The sample buyer has confirmed in-house assembly and a production need. Technical and commercial feasibility remain open.':'The latest structured process update takes priority over the starting profile.','Sample buyer feedback','buyer-'+id):''}${id==='harbor'&&state.monitoringApplied?chainItem(state.feedback[id]?5:4,'A later update changed the timing.','The sample expansion review is postponed. Agree when to reconnect rather than reuse the earlier opening.','Simulated monitoring event','monitoring'):''}${id==='evergreen'&&state.analyst.applied?chainItem(state.feedback[id]?5:4,'The sample analyst check supports segment relevance.',state.feedback[id]?.need==='confirmed'?'Segment relevance remains supported. Buyer feedback now establishes the sample need; technical compatibility and budget remain open.':'The buyer must still confirm the production constraint, ownership, and timing.','Simulated analyst finding','analyst'):''}</ol><div class="actions"><button class="link" onclick="researchConnection()">What research changed${icon('arrow-right')}</button><button class="link" onclick="allSources('${id}')">All account sources</button></div></section><aside><section class="surface"><div class="route-label">NEXT VALIDATION · ${st.route.toUpperCase()}</div><h2>${st.action}</h2><p class="next-question">${st.question}</p><p>${st.route==='analyst'?'An analyst can check segment relevance. The buyer is the source for the production need.':st.route==='technical'?'An application engineer should assess feasibility before any benefit or investment claim.':'The buyer can establish the process, need, ownership, and timing.'}</p><div class="actions"><button class="button" onclick="${st.route==='analyst'?'analystHandoff()':`openPlay('${id}')`}">${st.route==='analyst'?'Prepare analyst handoff':st.route==='technical'?'Prepare technical review':id==='harbor'&&state.monitoringApplied?'Prepare follow-up':'Prepare first conversation'}${icon('arrow-right')}</button></div></section><section class="surface"><h3>What did the buyer tell you?</h3><p>Add a process fact. The recommendation and affected plays will update.</p><div class="actions"><button class="button outline" onclick="feedbackForm('${id}')">Record buyer feedback</button></div></section></aside></div>`}`;}
function openPlay(id){if(E.status(state,id).route==='analyst'){analystHandoff();return;}set(E.draft(state,id,D.accounts));go('play/'+id);}
function questions(id){const st=E.status(state,id);return st.route==='technical'?['Which core designs and assembly steps need attention?','What constraints should an application engineer assess?','Who should join a technical review, and when?']:id==='harbor'&&state.monitoringApplied?['When will the expansion review restart?','What would make core assembly a priority?','Who owns the decision, and when should we reconnect?']:['Do you assemble laminated cores in-house?','Which production step needs more capacity?','Who owns that improvement, and what is the timing?'];}
function play(id){if(!state.round)return empty('Investigate the account first.','A conversation play needs a current recommendation.','View the goal','goal');if(id==='evergreen'&&(state.round<2||!state.analyst.applied))return empty('Resolve the segment question first.','SalesPlay has prepared an analyst question before progressing this account.','Review Evergreen','opportunity/evergreen');if(E.excluded(state,id))return opportunity(id);if(!state.drafts[id]){state=E.draft(state,id,D.accounts);persist();}const a=D.accounts[id],d=state.drafts[id],stale=d.version!==E.version(state,id);return `<a href="#opportunity/${id}" class="back">${icon('arrow-left')}Why this opportunity</a><div class="page-head"><div><span class="eyebrow">${a.name.toUpperCase()} · PREPARED ACTION</span><h1>${E.status(state,id).route==='technical'?'Prepare the technical review.':id==='harbor'&&state.monitoringApplied?'A useful follow-up, ready to review.':'Prepare your next conversation.'}</h1><p>Review and edit the opening before you use it.</p></div>${badge(E.status(state,id).label,E.status(state,id).tone)}</div><div class="play-layout"><section class="surface"><span class="eyebrow">START WITH</span><h2>${a.role}</h2><p>${E.status(state,id).route==='technical'?'Bring an application engineer into a process assessment before making an equipment claim.':'This team can confirm the process, production need, and the right next step.'}</p>${stale?`<div class="note amber"><h3>The facts behind this message changed.</h3><p>Keep the previous version for reference. Refresh and review the current opening before using it.</p><div class="actions"><button class="link" onclick="refreshDraft('${id}')">Refresh the opening${icon('arrow-right')}</button></div></div>`:''}<label class="field-label" for="opening">Your opening message</label><textarea id="opening" class="message" maxlength="3000" oninput="editDraft('${id}',this.value)">${esc(d.text)}</textarea><label class="review"><input id="review-check" type="checkbox" ${d.reviewed&&!stale?'checked':''} ${stale?'disabled':''} onchange="reviewDraft('${id}',this.checked)"><span>I’ve reviewed this opening against the current account facts.</span></label><div class="actions"><button id="save-play" class="button" ${E.ready(state,id)?'':'disabled'} onclick="savePlay('${id}')">Save reviewed play${icon('arrow-right')}</button><button id="export-play" class="button outline" ${E.ready(state,id)?'':'disabled'} onclick="exportPlay('${id}',false)">Export play</button></div><p class="mini" style="margin-top:14px">Draft only. Nothing is sent.</p></section><aside><section class="surface"><h3>Three questions for the call</h3><ol class="questions">${questions(id).map(q=>`<li>${q}</li>`).join('')}</ol></section><section class="surface"><h3>New information changes the work.</h3><p>Update the account when the buyer shares something new.</p><div class="actions"><button class="button outline" onclick="feedbackForm('${id}')">Record buyer feedback</button></div></section></aside></div>`;}
function editDraft(id,text){state=E.edit(state,id,text);persist();$('#review-check').checked=false;$('#save-play').disabled=true;$('#export-play').disabled=true;}
function reviewDraft(id,value){state=E.review(state,id,value);persist();$('#save-play').disabled=!E.ready(state,id);$('#export-play').disabled=!E.ready(state,id);}
function refreshDraft(id){set(E.draft(state,id,D.accounts));toast('Opening refreshed. Review the current version before use.');}
function savePlay(id){if(!E.ready(state,id))return;set(E.save(state,id));go('saved');toast('Play saved.');}
function playText(id,p){const a=D.accounts[id];return `SALESPLAY | ${a.name}\n\nGOAL\n${state.goal}\n\nNEXT ACTION\n${E.status(state,id).action}\nStart with: ${a.role}\n\nOPENING\n${p.text}\n\nQUESTIONS\n${questions(id).map((q,i)=>`${i+1}. ${q}`).join('\n')}\n\nEvidence version: ${p.version}\nSource types: public industry context, simulated specialist research, fictional account records, and any applied sample buyer or analyst updates.\nAll account findings are fictional. No live research, contact enrichment, CRM update, or outreach is connected. Production need, technical feasibility, budget, and timing must be established with the appropriate source.\n`;}
function download(name,text){const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportPlay(id,savedVersion){const p=savedVersion?state.saved.find(p=>p.id===id):state.drafts[id];if(!E.ready(state,id,p))return;download(D.accounts[id].name.replaceAll(' ','-')+'-Agentic-Sales-Play.txt',playText(id,p));}
function saved(){return `<span class="eyebrow">SAVED PLAYS</span><h1>Your saved plays.</h1><p class="intro">Open a reviewed message or check what changed.</p><section class="surface" style="margin-top:25px">${state.saved.length?state.saved.map(p=>{const a=D.accounts[p.id],valid=E.ready(state,p.id,p);return `<article class="saved-entry"><div class="account-head"><div class="avatar">${a.initials}</div><div><h2>${a.name}</h2><p>${valid?'Reviewed against current account facts':'Account facts have changed'}</p></div>${badge(valid?'Reviewed':'Needs review',valid?'green':'amber')}</div>${valid?'':`<div class="note amber"><h3>${E.excluded(state,p.id)?'This account no longer fits your equipment.':'This message needs a fresh review.'}</h3><p>${E.excluded(state,p.id)?'Core assembly is outsourced. This earlier opening is kept for reference and cannot be exported.':'Check the updated recommendation before using this opening.'}</p></div>`}<p class="message-preview">${esc(p.text)}</p><div class="actions"><button class="button ${valid?'':'outline'}" onclick="go('${valid?'play':'opportunity'}/${p.id}')">${valid?'Open reviewed play':'Review changed facts'}${icon('arrow-right')}</button><button class="link" ${valid?'':'disabled'} onclick="exportPlay('${p.id}',true)">Export reviewed play</button></div></article>`}).join(''):empty('No saved plays yet.','Review an opportunity and save your opening message.','Review opportunities','opportunities')}</section>`;}
function feedbackForm(id){feedbackAccount=id;dialog('BUYER FEEDBACK',`What changed at ${D.accounts[id].name}?`,`<span class="badge">Sample buyer response</span><label class="field"><span>Where does core assembly happen?</span><select id="process-update" onchange="syncFeedbackForm()"><option value="outsourced">Outsourced to a supplier</option><option value="inhouse">In-house</option><option value="unknown">Still unknown</option></select></label><label class="field"><span>Has the buyer confirmed a capacity need?</span><select id="need-update" onchange="syncNeedQuote()" disabled><option value="unknown">Not confirmed</option><option value="confirmed">Yes, for in-house core assembly</option></select></label><label class="field"><span>Buyer statement</span><textarea id="buyer-quote" maxlength="700">We buy finished cores from a supplier. Core assembly is not done in our plant.</textarea></label><div class="note"><h3 id="feedback-next">${id==='ridgeway'?'Exclude this account and update the search.':'Remove this account from the product shortlist.'}</h3><p id="feedback-detail">${id==='ridgeway'?'SalesPlay will look for explicit in-house assembly evidence at another account.':'The earlier play will need review.'}</p></div><div class="actions"><button class="button" onclick="applyBuyer('${id}')">Update opportunity${icon('arrow-right')}</button></div>`);}
function syncFeedbackForm(){const v=$('#process-update').value;$('#need-update').disabled=v!=='inhouse';if(v!=='inhouse')$('#need-update').value='unknown';$('#buyer-quote').value=v==='inhouse'?'We assemble laminated cores in-house. Our plant team can explain whether assembly needs more capacity.':v==='outsourced'?'We buy finished cores from a supplier. Core assembly is not done in our plant.':'We have not yet confirmed where core assembly happens.';$('#feedback-next').textContent=v==='outsourced'?(feedbackAccount==='ridgeway'?'Exclude this account and update the search.':'Remove this account from the product shortlist.'):'Update process fit and the next validation step.';$('#feedback-detail').textContent=v==='outsourced'&&feedbackAccount==='ridgeway'?'SalesPlay will look for explicit in-house assembly evidence at another account.':'Affected conversation plays will need a fresh review.';}
function syncNeedQuote(){if($('#process-update').value==='inhouse')$('#buyer-quote').value=$('#need-update').value==='confirmed'?'We assemble laminated cores in-house and need more core-assembly capacity.':'We assemble laminated cores in-house. Our plant team can explain whether assembly needs more capacity.';}
function applyBuyer(id){const process=$('#process-update').value,need=$('#need-update').value,quote=$('#buyer-quote').value;closeDialog();set(E.feedback(state,id,process,need,quote));if(process==='outsourced'&&id==='ridgeway'){set(E.start(state,D));go('investigation');startTimer();}else{go('opportunity/'+id);toast('Buyer fact recorded. The recommendation and previous review have changed.');}}
function analystHandoff(){if(state.round<2)return;if(!state.analyst.prepared)set(E.prepareAnalyst(state));dialog('ANALYST REVIEW','Check the product fit with an analyst.',`<span class="badge amber">${state.analyst.applied?'Sample finding applied':'Prepared locally · not sent'}</span><div class="detail-label">Question for a specialist analyst</div><p class="question-preview">Does Evergreen’s sample portfolio include laminated-core utility transformers within the segment map, and what qualification questions remain for the buyer?</p><div class="detail-label">Context already attached</div><p>Your goal, the process requirement, the operations profile, and the sample research map.</p>${sourcePills(['evergreen','segment'])}<div class="detail-label">Why an analyst</div><p>Segment relevance belongs to specialist research. Plant capacity and buying need belong to the buyer. Equipment compatibility belongs to an application engineer.</p>${state.analyst.applied?`<div class="note"><h3>The sample finding keeps Evergreen in scope.</h3><p>The production need still needs buyer confirmation.</p></div>`:`<div class="actions"><button class="button" onclick="applyAnalystFinding()">Apply sample analyst finding${icon('arrow-right')}</button></div><p class="mini">Sample response · no analyst request is sent.</p>`}`);}
function applyAnalystFinding(){set(E.applyAnalyst(state));closeDialog();go('opportunity/evergreen');toast('Sample analyst finding applied. Next: validate the production need with the buyer.');}
function changeSummary(){dialog('SEARCH UPDATED','The buyer update changed the next move.',`<table class="small-table"><thead><tr><th>Decision</th><th>Before</th><th>After</th></tr></thead><tbody><tr><td>Ridgeway fit</td><td>Provisional in-house profile</td><td>Buyer says assembly is outsourced</td></tr><tr><td>Seller action</td><td>Explore an equipment conversation</td><td>Stop that equipment approach</td></tr><tr><td>Search criteria</td><td>Investigate a suggested process fit</td><td>Require explicit, recent in-house evidence</td></tr><tr><td>Next investigation</td><td>Ridgeway</td><td>Evergreen sample operations profile</td></tr><tr><td>Saved play</td><td>Reviewed against earlier facts</td><td>Needs review; export blocked</td></tr></tbody></table><p>Ridgeway’s buyer fact updates this account. The search now requires explicit evidence that the next account assembles cores in-house.</p><div class="actions"><button class="button outline" onclick="closeDialog();go('activity')">Inspect the activity log</button></div>`);}
function activity(){const run=state.run;return `<div class="page-head"><div><span class="eyebrow">AGENT ACTIVITY</span><h1>The work behind your opportunities.</h1><p>Research completed, evidence used, and decisions updated.</p></div>${run?badge('Research '+run.id,'green'):''}</div>${run&&['running','paused'].includes(run.status)?`<div class="run-note">Research is ${run.status}. <button class="link" onclick="${run.status==='paused'?'resumeRun()':"go('investigation')"}">${run.status==='paused'?'Resume research':'View progress'}</button></div>`:''}<div class="live-layout"><section class="surface"><h2>Research and updates</h2>${state.events.length?[...state.events].reverse().map((e,i)=>`<div class="history-entry"><span class="step-num">${state.events.length-i}</span><div><h3>${esc(e.account?D.accounts[e.account].name+': '+e.title:e.title)}</h3><p>${esc(e.detail)}</p><p class="mini">${e.run?'Research '+e.run+' · ':''}Update ${state.events.length-i}</p>${sourcePills(e.sources)}</div></div>`).join(''):'<p>Your research history will appear here.</p><div class="actions"><button class="button" onclick="go(\'goal\')">Find opportunities</button></div>'}</section><aside><section class="surface"><span class="eyebrow">CURRENT GOAL</span><h3>What the agents are working toward</h3>${memory()}</section><section class="surface"><span class="eyebrow">ACCOUNT UPDATES</span>${badge('Sample update')}<h3 style="margin-top:12px">HarborGrid has postponed its expansion review.</h3><p>Update the account and prepare a different follow-up.</p><div class="actions"><button class="button outline" ${!state.round||state.monitoringApplied?'disabled':''} onclick="applyMonitoring()">${state.monitoringApplied?'Update applied':'Apply sample update'}</button></div></section><section class="surface"><h3>What could SalesPlay find for your team?</h3><p>Start with one product, one market, and five accounts.</p><div class="actions"><button class="button outline" onclick="validationPlan()">Plan a pilot${icon('arrow-right')}</button></div></section></aside></div>`;}
function applyMonitoring(){set(E.monitor(state));toast('Sample monitoring update applied. HarborGrid now needs a timing conversation.');}
function evidence(id){if(id.startsWith('buyer-')){const snapshot=state.buyerEvidence?.[id],account=snapshot?.accountId||id.slice(6),f=snapshot||state.feedback[account];return f?{type:'Sample buyer feedback',title:D.accounts[account].name+': current buyer fact',publisher:'Fictional scenario response',date:'Recorded in this scenario',supports:`Recorded process: ${f.process==='inhouse'?'in-house assembly':f.process==='outsourced'?'outsourced assembly':'still unknown'}. Production need: ${f.need==='confirmed'?'confirmed in this sample':'not confirmed'}. Buyer statement: ${f.quote||'No additional quote supplied.'}`,limit:'Fictional buyer update. It corrects this account’s process record; it does not establish a general fact about the market.'}:null;}return D.sources[id];}
function openSource(id){const e=evidence(id);if(!e)return;dialog(e.type,e.title,`<div class="meta"><strong>${esc(e.publisher)}</strong><br>${esc(e.date)}</div><div class="detail-label">What it supports</div><p>${esc(e.supports)}</p><div class="detail-label">What remains unconfirmed</div><p>${esc(e.limit)}</p>${e.url?`<div class="actions"><a class="button outline" href="${e.url}" target="_blank" rel="noopener noreferrer">Open public source${icon('arrow-up-right')}</a></div>`:''}`);}
function allSources(id){const ids=[...D.accounts[id].sourceIds,...(state.feedback[id]?['buyer-'+id]:[]),...(id==='evergreen'&&state.analyst.applied?['analyst']:[]),...(id==='harbor'&&state.monitoringApplied?['monitoring']:[])];dialog('LINKED EVIDENCE',`Sources for ${D.accounts[id].name}`,ids.map(sourceRow).join(''));}
function sourceRow(id){const e=evidence(id);return e?`<button class="source-row" onclick="openSource('${id}')"><strong>${esc(e.account?D.accounts[e.account].name+': '+e.title:e.title)}</strong><small>${esc(e.type)} · ${esc(e.publisher)}</small></button>`:'';}
function researchConnection(){dialog('RESEARCH CONNECTION','Why the manufacturing process changes the shortlist.',`<span class="badge">Sample specialist research</span><div class="comparison"><div><h3>The demand signal</h3><p>Grid investment gives you a reason to investigate transformer manufacturers.</p>${sourceRow('doe')}</div><div><h3>The product fit</h3><p>Your equipment supports laminated-core assembly. The sample segment map narrows the search to relevant applications and in-house production.</p>${sourceRow('segment')}</div></div><div class="note"><h3>A match is the start of a conversation.</h3><p>The buyer still needs to confirm the production constraint, ownership, and timing.</p></div>`);}
function validationPlan(){const p=state.pilot||{product:D.product,market:D.territory,outcome:'Identify useful new accounts and validate the next buyer conversation.'};dialog('YOUR SALESPLAY PILOT','Try this on your own accounts.',`<p>Scope a focused pilot with one product, one market, and five accounts.</p><label class="field"><span>Your product or solution</span><input id="pilot-product" maxlength="160" value="${esc(p.product)}"></label><label class="field"><span>Target market</span><input id="pilot-market" maxlength="160" value="${esc(p.market)}"></label><label class="field"><span>What should the pilot help you achieve?</span><textarea id="pilot-outcome" maxlength="600">${esc(p.outcome)}</textarea></label><p id="pilot-error" class="error" role="status"></p><div class="actions"><button class="button" onclick="savePilotBrief()">Prepare pilot brief${icon('arrow-right')}</button></div><p class="mini">This prepares a local brief. No request or account data is sent.</p>`);}
function showGuide(){about();}
function about(){dialog('SAMPLE WORKSPACE','About the data in this workspace.',`<p>This workspace demonstrates account discovery, evidence review, buyer feedback, and the next sales action using a controlled example.</p><p>Accounts, specialist research, analyst findings, and buyer responses are fictional. Agent research follows a predefined scenario; editing the example goal does not run a live search.</p><p>There is no live AI, entitled MarketsandMarkets data, CRM connection, outreach, analyst service, or background monitoring. Your goal edits and saved plays stay in this browser.</p><div class="detail-label">Public industry references</div>${['doe','lae'].map(sourceRow).join('')}<p class="mini">Public sources establish industry and equipment context. Account evidence and buying need must be validated independently. This independent prototype makes no measured performance or commercial claim.</p>`);}
function resetPrompt(){dialog('RESET SAMPLE DATA','Start with a fresh workspace?',`<p>Clear this workspace’s goal edits, research, buyer updates, pilot brief, and saved plays.</p><div class="actions"><button class="button" onclick="resetDemo()">Reset sample data</button><button class="button outline" onclick="closeDialog()">Keep my work</button></div>`);}
function resetDemo(){clearInterval(timer);state=E.initial(D.defaultGoal);goalNote=state.goal;persist();closeDialog();go('goal');toast('Sample workspace reset.');}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);$('#main').focus({preventScroll:true});});
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();}});
render();

function savePilotBrief(){const p={product:$('#pilot-product').value.trim(),market:$('#pilot-market').value.trim(),outcome:$('#pilot-outcome').value.trim()};if(!p.product||!p.market||!p.outcome){$('#pilot-error').textContent='Add your product, target market, and intended outcome.';return;}state={...state,pilot:p};persist();pilotSummary();}
function pilotSummary(){const p=state.pilot;if(!p)return;dialog('PILOT BRIEF','Your pilot brief is ready.',`<p>Use this brief to agree scope and next steps with your SalesPlay team.</p><div class="meta"><strong>Product</strong><p>${esc(p.product)}</p><strong>Market</strong><p>${esc(p.market)}</p><strong>Intended outcome</strong><p>${esc(p.outcome)}</p><strong>Starting scope</strong><p>Five accounts. Agree research access, a review owner, and a review date.</p></div><div class="actions"><button class="button" onclick="exportPilotBrief()">Export brief${icon('arrow-right')}</button><button class="button outline" onclick="validationPlan()">Edit brief</button></div><p class="mini">${storageFailed?'Available for this session.':'Saved in this browser.'} No pilot request has been submitted.</p>`);}
function exportPilotBrief(){const p=state.pilot;if(!p)return;download('SalesPlay-Pilot-Brief.txt',`SALESPLAY PILOT BRIEF\n\nProduct: ${p.product}\nMarket: ${p.market}\nIntended outcome: ${p.outcome}\nStarting scope: five accounts\n\nNext step: agree research access, review owner, review date, and success criteria with the SalesPlay team.\nThis is a locally prepared brief. No pilot request has been submitted.\n`);}

</script></body></html>
